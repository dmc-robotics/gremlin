# Generate Gremlin.xcodeproj with `xcodegen generate`. Edit this file, not the project.
name: Gremlin

options:
  bundleIdPrefix: com.gremlin
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sign to Run Locally
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

packages:
  GremlinKit:
    path: GremlinKit

targets:
  Gremlin:
    type: application
    platform: macOS
    sources:
      - Gremlin
    dependencies:
      - package: GremlinKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gremlin.mac
        PRODUCT_NAME: Gremlin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gremlin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Needs /dev/cu.* devices, arbitrary project folders, and to launch grot
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

  GremlinTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GremlinTests
    dependencies:
      - target: Gremlin
      - package: GremlinKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gremlin.mac.tests

schemes:
  Gremlin:
    build:
      targets:
        Gremlin: all
        GremlinTests: [test]
    test:
      targets:
        - GremlinTests
